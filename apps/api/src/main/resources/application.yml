spring:
  application:
    name: dealstoker-api
  datasource:
    # Populated by RailwayDatabaseUrls / DataSourceConfig. Do not point these
    # at raw Railway postgres:// values — conversion happens in code.
    url: ${dealstoker.jdbc-url:${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/dealstoker}}}
    username: ${dealstoker.jdbc-username:${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:dealstoker}}}
    password: ${dealstoker.jdbc-password:${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:dealstoker}}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dealstoker:
  # Canonical public site URL (must match www — apex redirects to www).
  app-base-url: ${APP_BASE_URL:https://www.dealstoker.com}
  amazon:
    marketplace: ${AMAZON_MARKETPLACE:www.amazon.com}
    partner-tag: ${AMAZON_PARTNER_TAG:dealstoker01-20}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://dealstoker.com,https://www.dealstoker.com}
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    # Optional stronger model just for guide drafts/rewrites/translations (long-form writing).
    guide-model: ${OPENAI_GUIDE_MODEL:}
  analytics:
    # Server-only secret for hashing visitor IPs (HMAC-SHA256). Use a long random value;
    # if unset, a random secret is generated on each start.
    ip-hash-secret: ${IP_HASH_SECRET:}

logging:
  level:
    com.dealstoker: INFO
