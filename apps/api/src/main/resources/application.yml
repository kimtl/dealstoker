spring:
  application:
    name: dealstoker-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dealstoker}
    username: ${DATABASE_USERNAME:dealstoker}
    password: ${DATABASE_PASSWORD:dealstoker}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

dealstoker:
  app-base-url: ${APP_BASE_URL:https://dealstoker.com}
  amazon:
    marketplace: ${AMAZON_MARKETPLACE:www.amazon.com}
    partner-tag: ${AMAZON_PARTNER_TAG:}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.dealstoker: INFO
