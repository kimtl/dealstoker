services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dealstoker
      POSTGRES_USER: dealstoker
      POSTGRES_PASSWORD: dealstoker
    ports:
      - "5432:5432"
    volumes:
      - dealstoker_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealstoker -d dealstoker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dealstoker_pg:
